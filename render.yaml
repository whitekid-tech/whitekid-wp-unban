services:
  - type: web
    name: whitekid-wp-ban
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPPORT_EMAIL
        value: support@whatsapp.com
      - key: ADMIN_KEY
        sync: false
      - key: SUPPORT_WA_NUMBER
        value: ""
